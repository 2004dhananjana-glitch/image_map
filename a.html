
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direction to ICT LAB</title>
</head>
<body style="margin: 0; padding: 0; overflow: hidden; background: rgba(233, 227, 227, 0);">
<div style="position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10;">
    <h1 style="color: #333; font-family: sans-serif; background: rgba(255, 255, 255, 0.7); 
               display: inline-block; padding: 10px 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);">
        faculty colosseum.
    </h1>
</div>
    <img id="main-img" src="img1.jpeg" usemap="#image-map" 
         style="width: 100%; height: 100vh; object-fit: cover; display: block; 
                transition: transform 0.8s ease-in, opacity 0.7s ease-in; pointer-events: auto;">

    <map name="image-map">
        <area target="" alt="Link B" title="Go to B" 
              coords="694,407,855,582" shape="rect" 
              onclick="startTransition(event, 'b.html')" style="cursor: pointer;">
    </map>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/image-map-resizer/1.0.10/js/imageMapResizer.min.js"></script>
    
    <script>
        
        imageMapResize();

        function startTransition(event, url) {
            
            event.preventDefault();

            const img = document.getElementById('main-img');

         
            img.style.transform = "scale(7)"; 
            img.style.opacity = "0";          

          
            setTimeout(() => {
                window.location.href = url;
            }, 700);
        }
    </script>

</body>
</html>
